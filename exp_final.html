<!DOCTYPE html>
<html lang = "en">

<head>
    <meta charset="utf-8" />
    <title>expense_tracker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="ExpenseTrackerStyle.css">
    <style>
        .input_row{
            margin-bottom: 5px;
        }
        .input_box{
            padding-bottom: 8px;
            padding-top: 8px;
        }
        .input_zone{
           background-color: white;
           border-style: solid;
           border-color: white;
           border-radius: 5px;
        }
    </style>
</head>

<body style = "background-color: lightgreen">

	<div id="top_buttons">
    <input type="file" id="fileInput" accept=".csv" style="display:none;" />
	<button type="button" onclick="document.getElementById('fileInput').click()">Import from CSV</button>
    <button type="button" onclick="export_to_csv()">Export to CSV</button>
	</div>

    <p id="sum_display">Total: $0.00</p>
    <p id="budget_display"> No budget entered </p>
	
    <div id="budget_container">
    <div class="budget-row">
    <label for="budget">Budget:</label>
    <div class="dollar-wrapper">
      <span class="dollar-prefix">$</span>
      <input type="number" id="budget" placeholder=" Enter Budget" onchange="set_budget()" />
    </div>
    </div>
    <button id="clear_button" type="button" onclick="clear_data()">CLEAR</button>
    </div>

    <br>
  
    <br>
    <br>
    <div class="input_zone" id="input_area">
    <button type="button" onclick="add_expense()">+ Add Expense</button>
	</div>
        <script>
              // Listener for CSV file input
             document.getElementById('fileInput').addEventListener('change', function (event) {
                 const file = event.target.files[0];
                 if (file) {
                     const reader = new FileReader();
                     reader.onload = function (e) {
                         const content = e.target.result;
 
                         //  -- originally wasn't parsing file
                         const rows = content.split('\n').map(row => row.trim()).filter(row => row.length > 0);
                        
                     //    clear_data();
                         rows.forEach(row => {
                             const cols = row.split(',').map(col => col.trim());
                             if (cols.length >= 4) { // Expecting [Name, Date, Category, Price]
                                 var options = ["Misc.", "Food", "Travel", "Groceries", "Fun"];
                                 var new_row = document.createElement("div");
                                 new_row.classList.add("input_row");
     
                                 // Create name 
                                 var new_name = document.createElement("input");
                                 new_name.type = "text";
                                 new_name.value = cols[0];
                                 new_name.classList.add("input_box");
     
                                 // Format date to YYYY-MM-DD
                                 const dateParts = cols[1].split(/[\/\-]/);
                                 let formattedDate = "";
                                 if (dateParts.length === 3) {
                                     let [part1, part2, part3] = dateParts;
                                     if (part3.length === 4) {
                                         const month = part1.padStart(2, '0');
                                         const day = part2.padStart(2, '0');
                                         const year = part3;
                                         formattedDate = `${year}-${month}-${day}`;
                                     }
                                 }
     
                                 // Create Date
                                 var new_date = document.createElement("input");
                                 new_date.type = "date";
                                 new_date.value = formattedDate;
                                 new_date.classList.add("input_box");
     
                                 // Create category
                                 var new_category = document.createElement("select");
                                 new_category.classList.add("input_box");
                                 options.forEach(function (option_text) {
                                     var option = document.createElement("option");
                                     option.value = option_text.toLowerCase();
                                     option.textContent = option_text;
                                     new_category.appendChild(option);
                                 });
     
                                 const lowerColsCategory = cols[2].toLowerCase();
                                 const foundOption = options.find(opt => opt.toLowerCase() === lowerColsCategory);
 
                                 // Create price
 
                                 new_category.value = foundOption ? lowerColsCategory : "misc.";
     
                                 var new_price = document.createElement("input");
                                 new_price.type = "number";
                                 new_price.step = "0.01";
                                 new_price.min = "0.00";
                                 new_price.value = parseFloat(cols[3]).toFixed(2);
                                 new_price.classList.add("input_box");

                                 new_price.addEventListener("change", function() {
                                    new_row.stored_price = (parseFloat(new_price.value)).toFixed(2);
                                    new_price.value = new_row.stored_price;
                                    console.log(new_row.stored_price);
                                    calc_sum();
                                 });
     
                                 var new_delete = document.createElement("button");
                                 new_delete.textContent = "Delete";
                                 new_delete.type = "button";
                                 new_delete.classList.add("input_box");
                                 new_delete.onclick = function () {
                                     delete_expense(new_row);
                                     calc_sum();
                                 };
     
                                 new_row.appendChild(new_name);
                                 new_row.appendChild(new_date);
                                 new_row.appendChild(new_category);
                                 new_row.appendChild(new_price);
                                 new_row.appendChild(new_delete);
     
                                 new_row.stored_name = cols[0];
                                 new_row.stored_date = formattedDate;
                                 new_row.stored_category = new_category.value;
                                 new_row.stored_price = parseFloat(cols[3]).toFixed(2);
     
                                 document.getElementById("input_area").appendChild(new_row);
                             }
                         });
     
                         calc_sum();
                         document.getElementById('fileinput').value="";
                     };
                     reader.readAsText(file);
                 }
             });
         </script>
		 
	<script>
		function export_to_csv() {
			let rows = document.querySelectorAll("#input_area .input_row");
			if (rows.length === 0) {
				alert("No expenses to export.");
				return;
			}

			let csvContent = "";

			rows.forEach((row) => {
			let name = row.querySelector("input[type='text']").value || "";
			let date = row.querySelector("input[type='date']").value || "";
			let category = row.querySelector("select").value || "";
			let price = row.querySelector("input[type='number']").value || "0.00";

			csvContent += `${name},${date},${category},${price}\n`;
		});

		// Download the CSV
		const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
		const url = URL.createObjectURL(blob);
		const link = document.createElement("a");
		link.setAttribute("href", url);
		link.setAttribute("download", "expenses.csv");
		document.body.appendChild(link);
		link.click();
		document.body.removeChild(link);
	}
</script>
 
     <script>
    
    // Declaration for arrays to keep track of info
    // Also variables for sum, entered budget, and the difference
    const names = [];
    const dates = [];
    const categories = [];
    const prices = [];
    var expense_sum = 0;
    var user_budget = 0;
    var difference = 0;

		// Function to set the budget variable and calls the calc_sum function
        function set_budget() {
            const budget_input = document.getElementById("budget");
            user_budget = parseFloat(budget_input.value).toFixed(2);
            budget_input.value = user_budget;

            console.log("Budget: " + user_budget);
            calc_sum();
        }
        // Function to create a new expense when the button is pushed
        // Basically everything important
                function add_expense()
        {
            // Array for categories
            var options = ["Misc.","Food", "Travel", "Groceries", "Fun"];

            // Creates a "div" for the added row
            var new_row = document.createElement("div");
            new_row.classList.add("input_row");

            // Creates the new input fields for the expense
                // Expense name
                var new_name = document.createElement("input");
                new_name.type = "text";
                new_name.placeholder = "Enter Name";
                new_name.classList.add("input_box");

                // Expense date
                var new_date = document.createElement("input");
                new_date.type = "date";
                new_date.classList.add("input_box");

                // Expense category
                var new_category = document.createElement("select");
                new_category.type = "select";
                new_category.classList.add("input_box");

                // AI was reffered to for this, turns out it needed to be called as an "anonymous function" in order for the .forEach to work properly with the array 
                // Thanks js, god forbid you work like everything else
                options.forEach(function(option_text) {
                    var option = document.createElement("option");
                    option.value = option_text;
                    option.textContent = option_text;
                    new_category.appendChild(option);
                });

                new_category.value = "Misc.";

                // Expense price
                var new_price = document.createElement("input");
                new_price.type = "number";
                new_price.step = "0.01";
                new_price.min = "0.00";
                new_price.placeholder = "Enter Price";
                new_price.classList.add("input_box");

                // Creates and sets the row's delete button
                var new_delete = document.createElement("button");
                new_delete.textContent = "Delete";
                new_delete.type = "button";
                new_delete.classList.add("input_box");

                // Return of the dastardly ANONYMOUS FUNCTION, set to use the delete_expense function on it's respective "row" and re-calc the sum
                new_delete.onclick = function() {
                    delete_expense(new_row);
                    calc_sum();
                }

    
            // Appends the created fields/button to the new row
            new_row.appendChild(new_name);
            new_row.appendChild(new_date);
            new_row.appendChild(new_category);
            new_row.appendChild(new_price);
            new_row.appendChild(new_delete);

            // Variables to store the input info to be read into the arrays set to be local for each new_row
            new_row.stored_name;
            new_row.stored_date;
            new_row.stored_category;
            new_row.stored_price;
            
            // THE ANONYMOUS FUNCTION STRIKES YET AGAIN
            // Listener events to trigger for whenver the user interacts with the inputs to assign them to their respective variables
            new_name.addEventListener("change", function() {
                new_row.stored_name = new_name.value;
                console.log(new_row.stored_name);
                calc_sum();
            });

            new_date.addEventListener("change", function() {
                new_row.stored_date = new_date.value;
                console.log(new_row.stored_date);
                calc_sum();
            });

            new_category.addEventListener("change", function() {
                new_row.stored_category = new_category.value;
                console.log(new_row.stored_category);
                calc_sum();
            });

            new_price.addEventListener("change", function() {
                new_row.stored_price = (parseFloat(new_price.value)).toFixed(2);
                new_price.value = new_row.stored_price;
                console.log(new_row.stored_price);
                calc_sum();
            });
			

            // Appends the new row to the overal input area
            document.getElementById("input_area").appendChild(new_row);
            calc_sum();
        }

        // Function for the delete button to remove it's respective row
        function delete_expense(row){
            row.remove();
        }
		
		// Function to clear data
        function clear_data(){

            const rows = document.querySelectorAll("#input_area .input_row");
            
            rows.forEach(function(row) {
                row.remove();
            });

           calc_sum()
        }
       
        /** First resets all arrays to 0 to remove any old info
         * Goes through the stored variables in every row adding them to array
         * Searches through the prices array using .reduce and sets expense_sum to equal the sum of all entries
         * */
        function calc_sum(){
            names.length = 0;
            dates.length = 0;
            categories.length = 0;
            prices.length = 0;

            const rows = document.querySelectorAll("#input_area .input_row");

            rows.forEach(function(row) {

                // Push for name
                if(typeof(row.stored_name) == 'undefined' || row.stored_name == ""){
                    names.push("N/A")
                }
                else{
                    names.push(row.stored_name);
                }

                // Push for date
                if(typeof(row.stored_date) == 'undefined' || row.stored_date == ""){
                    dates.push("N/A")
                }
                else{
                    dates.push(row.stored_date);
                }

                // Push for category
                if(typeof(row.stored_category) == 'undefined'){
                    categories.push("Misc.")
                }
                else{
                    categories.push(row.stored_category);
                }

                // Push for price
                if (isNaN(row.stored_price)){
                    prices.push(0.00);
                }
                else{
                    prices.push(row.stored_price);
                }
            });

            // Log tests to see if arrayed correctly.
            console.clear();
            console.log("Names:", names);
            console.log("Dates:", dates);
            console.log("Categories:", categories);
            console.log("Prices:", prices);
            

            expense_sum = (prices.reduce((accumulator, currentValue) => accumulator + parseFloat(currentValue), 0)).toFixed(2);
            document.getElementById("sum_display").textContent = 'Total: $' + expense_sum;
            console.log("Total:", expense_sum);
            console.log("Budget:", user_budget);

            /* If the budget input area is empty or equals 0 it displays that no budget was entered
            since an empty number input defaults to 0*/

            /* If budget is a number, calculates the difference between the budget and sum and display whether
            the user is within, over, or exactly at the budget based on said difference*/
            
            if(user_budget <= 0 || isNaN(user_budget)){
                document.getElementById("budget_display").textContent = "No budget entered";
                console.log("NA Difference");
            }
            else{
                var difference = (user_budget - expense_sum).toFixed(2);
                console.log("Difference (Budget - Sum):", difference);
                if(difference > 0){
                    document.getElementById("budget_display").textContent = "$" + difference + " under budget";
                }
                else if(difference < 0){
                    difference = (Math.abs(user_budget - expense_sum)).toFixed(2);
                    document.getElementById("budget_display").textContent = "$" + difference + " over budget";
                }
                else{
                    document.getElementById("budget_display").textContent = "On budget";
                }
            }
        }

    </script>

</body>
</html>
